<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX AI: ESCOLHA SEU FUTURO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Canvas do Digital Rain -->
    <canvas id="matrix-rain"></canvas>

    <!-- Tela Inicial -->
    <div id="start-screen" class="screen active">
        <div class="container">
            <h1 id="main-title" class="glow">MATRIX AI: ESCOLHA SEU FUTURO</h1>
            <p class="subtitle typewriter">Como a Inteligência Artificial pode ajustar e transformar o seu destino. Suas decisões moldarão o amanhã.</p>
            <button id="start-btn" class="neon-btn">INICIAR SIMULAÇÃO</button>
        </div>
    </div>

    <!-- Tela de Perguntas -->
    <div id="quiz-screen" class="screen">
        <div class="container">
            <div class="progress-bar">
                <div id="progress" class="progress-fill"></div>
            </div>
            <div class="question-card">
                <h2 id="question-number" class="glow-small"></h2>
                <p id="question-text" class="typewriter"></p>
                <div id="options-container" class="options"></div>
            </div>
        </div>
    </div>

    <!-- Tela de Resultado -->
    <div id="result-screen" class="screen">
        <div class="container">
            <h1 id="result-title" class="glow"></h1>
            <div id="result-description" class="result-box"></div>
            <div class="scores">
                <div class="score-item utopia">Utopia: <span id="score-utopia">0</span></div>
                <div class="score-item balanced">Equilíbrio: <span id="score-balanced">0</span></div>
                <div class="score-item resistant">Resistência: <span id="score-resistant">0</span></div>
            </div>
            <button id="restart-btn" class="neon-btn">REINICIAR SIMULAÇÃO</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

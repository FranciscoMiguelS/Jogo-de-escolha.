<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dilemas da IA: Qual é a sua visão?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-card">
    <div id="quiz-screen">
      <span class="step-indicator" id="step-text">Pergunta 1 de 4</span>
      <h2 id="question-text">Carregando pergunta...</h2>
      <div id="options-container" class="options-group"></div>
    </div>

    <div id="result-screen" class="hidden">
      <span class="badge">Seu Perfil</span>
      <h2 id="result-title">Perfil</h2>
      <p id="result-desc">Descrição do seu perfil...</p>
      <button class="btn-restart" onclick="restartGame()">Jogar Novamente</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
